<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e12">
  <title data-t="four.pageTitle">Four in a Row</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/arcade.css">
  <style>
    .game-page { --game: var(--four); }

    .stage { position: relative; width: 100%; max-width: 480px; }
    .board {
      direction: ltr;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      padding: 10px;
      aspect-ratio: 7 / 6.2;
      background: var(--four);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .slot {
      position: relative;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: inset 0 3px 0 rgba(0,0,0,.25);
    }
    .column {
      grid-row: 1 / -1;
      z-index: 2;
      border-radius: 14px;
      transition: background .15s ease;
    }
    @media (hover: hover) {
      .column:hover { background: rgba(255,255,255,.1); }
    }
    .disc {
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: clamp(18px, 6vw, 30px);
      animation: drop calc(.18s + var(--fall) * .06s) cubic-bezier(.5, 0, .75, 0) both, settle .22s ease-out calc(.18s + var(--fall) * .06s);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
    }
    .disc.p1 { background: #ff5a5f; }
    .disc.p2 { background: #ffc83d; }
    .board.finished .disc:not(.win) { opacity: .35; transition: opacity .4s ease .3s; }
    .disc.win { animation: pulse .7s ease-in-out infinite alternate; }
    @keyframes drop { from { transform: translateY(calc(var(--fall) * -116%)); } }
    @keyframes settle { 40% { transform: translateY(-8%); } }
    @keyframes pulse { to { transform: scale(1.1); box-shadow: 0 0 0 4px #fff; } }

    .status {
      width: 100%; max-width: 480px;
      min-height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 6px 8px 6px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-weight: 700;
    }
    [dir="rtl"] .status { padding: 6px 18px 6px 8px; }
    .status .btn { flex: none; }

    .reactions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .reaction {
      width: 48px; height: 48px;
      font-size: 24px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
      transition: transform .15s ease;
    }
    .reaction:active { transform: scale(.85); }
    .float-reaction {
      position: absolute;
      bottom: 10%;
      font-size: 56px;
      pointer-events: none;
      z-index: 6;
      animation: rise 1.8s ease-out forwards;
    }
    .float-reaction.me { inset-inline-start: 12%; }
    .float-reaction.them { inset-inline-end: 12%; }
    @keyframes rise {
      0% { transform: translate(0, 20px) scale(.4); opacity: 0; }
      15% { transform: translate(0, 0) scale(1.15); opacity: 1; }
      100% { transform: translate(var(--drift), -260px) scale(1); opacity: 0; }
    }
    .overlay { border-radius: var(--radius); }
  </style>
</head>
<body class="game-page">
  <header class="topbar">
    <a class="icon-btn" href="./" data-back data-t-label="back"></a>
    <h1><span aria-hidden="true">🍓</span><span data-t="four.title">Four in a Row</span></h1>
    <span class="net-badge" id="netBadge" hidden></span>
    <button class="icon-btn" data-action="sound"></button>
    <button class="icon-btn" data-action="lang"></button>
  </header>

  <section class="players">
    <div class="player p1" id="p1"><span class="token">🍓</span><span><span class="name"></span><span class="score">0</span></span></div>
    <div class="player p2" id="p2"><span class="token">🍋</span><span><span class="name"></span><span class="score">0</span></span></div>
  </section>

  <div class="stage" id="stage">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden></div>
  </div>

  <div class="status" aria-live="polite">
    <span id="statusText"></span>
    <button class="btn btn-primary" id="statusAction" hidden></button>
  </div>

  <div class="reactions" id="reactions" hidden></div>

  <script type="module" src="js/four/main.js"></script>
</body>
</html>
